<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABDE | تسجيل الدخول</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 0 40px rgba(255, 23, 68, 0.08);
    }

    .logo {
      text-align: center;
      color: #ff1744;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #bbb;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #080808;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ff1744;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #ff1744;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.6;
    }

    .bottom {
      text-align: center;
      margin-top: 22px;
      color: #888;
    }

    a {
      color: #ff1744;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">ABDE</div>

    <h1>تسجيل الدخول</h1>

    <form id="loginForm">

      <label for="email">البريد الإلكتروني</label>
      <input
        id="email"
        type="email"
        placeholder="example@email.com"
        required
      >

      <label for="password">كلمة المرور</label>
      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        required
      >

      <button type="submit">تسجيل الدخول</button>

    </form>

    <div id="message"></div>

    <div class="bottom">
      ليس لديك حساب؟
      <a href="/register.html">إنشاء حساب</a>
    </div>

    <a class="back" href="./">العودة إلى الرئيسية</a>

  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      message.textContent = "جاري تسجيل الدخول...";

      try {
        const response = await fetch("https://abde-site.onrender.com/login", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        });

        const data = await response.json();

        if (data.success) {
          message.textContent = "تم تسجيل الدخول بنجاح ✓";

          setTimeout(() => {
            window.location.href = "/";
          }, 700);

        } else {
          message.textContent = data.message;
        }

      } catch (error) {
        message.textContent = "تعذر الاتصال بالخادم";
      }
    });
  </script>

</body>
</html>
